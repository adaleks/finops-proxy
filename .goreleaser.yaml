# GoReleaser configuration for finops-proxy.
# Run locally with:  goreleaser release --snapshot --clean
# Triggers in CI on any `v*` tag push (see .github/workflows/release.yml).
#
# Release notes are generated by GitHub from merged pull requests (github-native),
# so no commit-message convention is required. CHANGELOG.md is curated by hand and
# is the durable record; the GitHub release notes are the auto-generated summary.

version: 2

builds:
  - id: proxy
    main: ./cmd/proxy
    binary: finops-proxy
    # -X requires `var version` (not const) in cmd/proxy/main.go.
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: finops-run
    main: ./cmd/finops-run
    binary: finops-run
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# mockserver is dev-only (built from source via the Dockerfile); it is not
# published as a release artifact.

archives:
  - formats: [tar.gz, zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: adaleks
    name: finops-proxy
